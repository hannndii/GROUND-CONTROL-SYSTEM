<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP Modul 6</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-5">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="#">TP Modul 6</a>
        <form class="d-flex" role="search">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search"
            aria-label="Search"
          />
          <button class="btn btn-success" type="submit">Search</button>
        </form>
      </div>
    </nav>

    <div class="container my-5">
      <div class="card mx-auto shadow-sm" style="max-width: 400px;">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Form Pendataan</h4>
          <form>
            <div class="mb-3">
              <label for="nama" class="form-label fw-semibold">Nama</label>
              <input type="text" class="form-control" id="nama" required />
            </div>
            <div class="mb-3">
              <label for="nim" class="form-label fw-semibold">NIM</label>
              <input type="text" class="form-control" id="nim" required />
            </div>
            <div class="mb-4">
              <label for="angkatan" class="form-label fw-semibold">Angkatan</label>
              <input type="text" class="form-control" id="angkatan" required />
            </div>
            <div class="d-flex justify-content-end gap-3">
              <button type="reset" class="btn btn-danger">Cancel</button>
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="container mb-5">
      <h4 class="text-center mb-3">Table Data</h4>
      <div class="table-responsive">
        <table class="table table-dark table-striped text-center align-middle">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>NIM</th>
              <th>Angkatan</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Budi</td>
              <td>130299000</td>
              <td>1999</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Cahyo</td>
              <td>1302212000</td>
              <td>2021</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Dudi</td>
              <td>1302201040</td>
              <td>2020</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
