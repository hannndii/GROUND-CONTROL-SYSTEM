<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 70px;
        }
        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100; 
        }
        .logo {
            color: white;
            font-size: 24px;
            text-decoration: none;
        }
        .nav-menu {
            list-style-type: none;
            margin: 0;
            padding: 10px;
            display: flex;
            margin-right: 100px;
        }
        .nav-menu li {
            margin-left: 60px;
        }
        .nav-menu li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .nav-menu li a:hover {
            color: yellow;
            transition: color 0.3s;
        }

        .home-section {
            text-align: start;
            margin-top: 50px;
            border: #a59797 solid 1px;
            background-image: url("wallpaperflare.com_wallpaper (18).jpg");
            background-size: cover;
            background-position: center;
            padding: 15%;
        }

        .collection-section{
            padding-top: 10%;
        }
        .collection-container {
            margin-top: 50px;
            display: grid;
            justify-content: space-between;
            align-items: center;
            grid-template-columns: repeat(4, 1fr); 
        }
        .img-one, .img-two, .img-three, .img-four {
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .collection-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .img-one, .img-two, .img-three, .img-four {
                margin-bottom: 20px;
            }
            .navbar-container {
                padding: 10px 15px;  
            }

            .logo {
                font-size: 18px;  
            }

            .nav-menu li {
                margin-left: 10px; 
            }

            .nav-menu li a {
                font-size: 14px;  
            }
        }
    </style>
</head>
<body>
    <header class="navbar-container">
        <h3 class="logo">My Site</h3>
        <ul class="nav-menu">
            <li><a href="home.html">Home</a></li>
            <li><a onclick="alert('About page')">About</a></li>
            <li><a onclick="alert('Service page')">Services</a></li>
            <li><a onclick="alert('Contact page')">Contact</a></li>
        </header>
    <section id="home" class="home-section">
        <h1 style="color: blue">Welcome to My Site</h1>
        <p>This is a simple homepage layout.</p>
    </section>
    <section id="collection" class="collection-section">
        <h1 style="color: blue">Collection</h2>
        <div class="collection-container">
            <div class="img-one">
                <img src="1.jpg" alt="gambar1" style="width:100%; height:100%;">
                <h3>Lewis keren 01</h3>
            </div>
            <div class="img-two">
                <img src="2.jpg" alt="gambar2" style="width:100%; height:100%;">
                <h3>Lewis keren 02</h3>
            </div>
            <div class="img-three">
                <img src="3.jpg" alt="gambar3" style="width:100%; height:100%;">
                <h3>Lewis keren 03</h3>
            </div>
            <div class="img-four">
                <img src="3.jpg" alt="gambar3" style="width:100%; height:100%;">
                <h3>Lewis keren 04</h3>
            </div>
        </div>
    </section>
</body>
</html>
