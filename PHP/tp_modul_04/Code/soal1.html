<!DOCTYPE html>
<html>
<head>
    <title>NIM_Soal2</title>
    <link type="text/css" rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-control {
            width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body onload="getInputDanIsiForm()">
    <form>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" class="form-control" id="nama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" readonly>
        </div>
    </form>

    <script type="text/javascript">
        function getInputDanIsiForm() {
            let namaInput = prompt("Masukkan nama kamu:", "Mr Dummy");

            let nimInput = prompt("Masukkan nim kamu:", "1301180001");

            if (namaInput !== null) {
                document.getElementById('nama').value = namaInput;
            }

            if (nimInput !== null) {
                document.getElementById('nim').value = nimInput;
            }
        }
    </script>

</body>
</html>
