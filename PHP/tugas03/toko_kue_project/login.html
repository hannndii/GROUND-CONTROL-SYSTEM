<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - Toko Kue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header"><h1>Admin Toko Kue - Login</h1></div>
    <div class="content">
      <div class="form-card">
        <form action="show.html" method="get">
          <label class="small">Email</label>
          <input class="input" type="email" name="email" placeholder="admin@tokokue.example" required>
          <label class="small">Password</label>
          <input class="input" type="password" name="password" placeholder="••••••" required>
          <button class="btn" type="submit">Masuk</button>
        </form>
        <p class="small">Contoh akun: admin@tokokue.example / password</p>
      </div>
    </div>
  </div>
</body>
</html>
